[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forprint-prepress-hub"
version = "0.0.1"
description = "ForPrint Prepress Hub"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7,<9",
  "PyYAML>=6,<7",
]
gdl = [
  "PyMuPDF>=1.28,<2",
  "Pillow>=12,<13",
  "pikepdf>=10,<11",
  "pypdf>=6,<7",
  "reportlab>=5,<6",
  "fonttools>=4.66,<5",
  "lxml>=6,<7",
  "python-docx>=1.2,<2",
  "CairoSVG>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

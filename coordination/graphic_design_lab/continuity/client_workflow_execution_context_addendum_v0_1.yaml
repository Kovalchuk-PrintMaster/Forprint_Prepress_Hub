schema_version: gdl_client_workflow_execution_context_addendum_v0_1
status: ACTIVE_CONTINUITY_REQUIREMENT
fresh_assistant_must_know:
- recurring client work builds client profile and reusable skeleton in parallel
- private assets live outside git in _forprint_automation workspace
- reuse before new is mandatory
- intake normalizes human input
- deterministic planning decides creator scope
- creator receives smallest unresolved visual unit
- composition is deterministic after design freeze
- preview comes from same editable source
- machine-conformant input may bypass intake
primary_paths:
- coordination/graphic_design_lab/execution/
- coordination/graphic_design_lab/client_workflows/
- coordination/graphic_design_lab/directions/greeting_cards/
project_internal_execution_rule:
  prefer_existing_project_tool: true
  patch_project_tool_instead_of_reissuing_full_runner: true
  stable_short_operator_command_after_integration: true
  chat_contains_execution_intent_not_canonical_implementation: true
  client_private_paths_and_assets_remain_external: true

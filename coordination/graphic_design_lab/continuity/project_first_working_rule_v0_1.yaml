schema_version: gdl_project_first_working_rule_v0_1
status: ACTIVE_OPERATING_RULE
rule: chat_may_model_or_draft_but_reusable_workflow_knowledge_must_be_integrated_into_project
before_context_closeout:
- integrate_new_global_rules
- integrate_new_direction_rules
- record_material_prompts_or_refs
- record_case_outcomes
- update_active_case_next_state
- ensure_assistant_context_surface_points_to_new_knowledge
success_condition: next_assistant_does_not_need_to_rediscover_the_same_behavior
project_internal_tooling_policy:
  canonical_rule: REPEATABLE_EXECUTION_LOGIC_LIVES_IN_PROJECT
  chat_script_role: BOUNDED_BOOTSTRAP_PATCH_OR_REPAIR_ONLY
  stable_operator_entrypoints_required: true
  repeat_execution_from_chat_only: false
  operator_execution_model:
    target_state: PROJECT_EXECUTES_REPEATABLE_WORK_CHAT_SUPPLIES_INTENT_DESIGN_AND_REVIEW
    chat_operational_logic_minimized: true
    normal_operator_action: SHORT_STABLE_PROJECT_COMMAND
    long_repeatable_manual_shell_sequences_preferred: false
    evidence_and_reports_generated_by_project: true
    new_chat_functionality_should_be_integrated_into_project_before_repeat_use: true
    preferred_interaction:
    - run_project_command
    - inspect_project_generated_report
    - approve_rework_or_explicit_closeout
    project_owned_closeout:
      explicit_operator_authorization_required: true
      inspect_exact_diff_before_git_mutation: true
      protected_or_unwanted_paths_require_human_review: true
      exact_path_stage_only: true
      broad_git_add_forbidden: true
      may_commit_push_and_verify_when_explicitly_requested: true
      origin_sync_verification_required_after_push: true
  assistant_behavior:
  - inspect_existing_project_tool_before_new_logic
  - patch_or_extend_existing_project_tool_when_behavior_changes
  - promote_proven_repeatable_chat_logic_into_repository_before_reuse
  - invoke_repeatable_work_through_stable_make_or_cli_entrypoint
  - keep_chat_focused_on_intent_evidence_decisions_and_bounded_project_mutation
  forbidden_patterns:
  - full_repeatable_renderer_lives_only_in_chat
  - new_ad_hoc_runner_for_every_revision
  - duplicate_project_functionality_in_chat_when_project_entrypoint_exists
  - require_future_assistant_to_reconstruct_execution_from_chat_history
  operator_contract:
    implementation_source_of_truth: PROJECT_REPOSITORY
    preferred_entrypoint_order:
    - Makefile_target
    - project_cli
    - project_script
    chat_supplied_patch_scripts_are_disposable_after_project_integration: true
blueprint_pattern_inheritance_policy:
  access: READ_ONLY_STRICT
  inspect_committed_blueprint_equivalent_before_new_generic_tool: true
  inherit_semantics_safety_gates_and_operator_pattern_when_compatible: true
  local_implementation_required: true
  hidden_runtime_dependency_on_blueprint_forbidden: true
  blueprint_mutation_from_module_forbidden: true
  blind_current_step_increment_forbidden: true
  automatic_next_step_activation_without_explicit_gate_forbidden: true
local_execution_cursor_policy:
  scope: GRAPHIC_DESIGN_LAB_ONLY

  cursor:
    continuity/current_execution_cursor_v0_1.yaml

  max_active_tasks: 3

  work_admission:
    active_task_binding_required: true
    execution_plan_step_required: true
    started_substantial_work_must_be_registered: true
    chat_only_active_task_forbidden: true

  blocked_work:
    keep_visible: true
    fallback_requires_explicit_registration: true

  roadmap_reconciliation:
    live_state_check_before_material_step: true
    reuse_extend_adapt_before_new: true
    material_execution_path_change_requires_plan_update_first: true

  authority_boundary:
    blueprint_write_forbidden: true
    blueprint_work_front_is_not_gdl_local_cursor: true
    parent_prepress_roadmap_write_from_gdl_forbidden: true

- return_long_manual_shell_sequences_when_a_project_entrypoint_can_own_the_work
- duplicate_project_closeout_logic_in_chat_when_a_supported_closeout_entrypoint_exists
- invent_generic_local_coordination_tool_before_inspecting_committed_blueprint_equivalent
- silently_resolve_material_architectural_ambiguity
- promote_experimental_tool_to_runtime_dependency_without_operator_confirmation
- require_previous_chat_to_reconstruct_an_active_machine_handoff
- implement_deferred_v2_features_while_v1_scope_is_active
- discard_unimplemented_but_material_operator_intent


schema_version: gdl_greeting_card_embedded_component_bindings_v0_1
status: ACTIVE_V1_RUNTIME_BINDING
direction_id: greeting_cards

purpose: >
  Bind deterministic greeting-card Builder components that are embedded in exact,
  hash-verified private PDF sources. Component identity is content-derived and
  never inferred from a customer filename.


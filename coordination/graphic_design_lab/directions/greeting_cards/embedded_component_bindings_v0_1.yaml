runtime_rules:
  supported_signature_variants:
    - GRIGO
    - HERASYMENKO
    - DUAL_GRIGO_HERASYMENKO
  exact_source_pdf_hash_required: true
  exact_component_hash_required: true
  filename_based_signature_selection_allowed: false
  silent_signature_fallback_allowed: false
  illustrator_runtime_dependency: false

privacy:
  private_absolute_path_tracked_in_git: false
  client_identity_required_in_binding_contract: false

scope:
  all_current_signature_variants_bound: true
  renderer_implemented_here: false
  private_source_relocation_from_lab_tmp_to_stable_workspace: deferred_before_production_ready

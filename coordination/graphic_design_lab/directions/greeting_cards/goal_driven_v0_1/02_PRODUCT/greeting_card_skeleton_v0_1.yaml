  origin: TOP_LEFT_PHYSICAL_PDF
  physical_pdf:
  - 214
  - 301
  trim:
  - 210
  - 297
  trim_offset_each_side: 2
  source_status: VERIFIED_HISTORICAL_NOT_AUTOMATIC_RUNTIME
physical_order:
- page: 1

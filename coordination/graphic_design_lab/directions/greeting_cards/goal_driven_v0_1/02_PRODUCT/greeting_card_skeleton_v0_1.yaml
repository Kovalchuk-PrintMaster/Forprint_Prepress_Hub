elements:
- id: P01.SENDER_LOGO
  behavior: circular_sender_logo; scaled/raised with recipient-logo variant
  geometry: SOURCE_EXISTING_BUILDER_NEEDS_RECONCILIATION
- id: P01.RECIPIENT_LOGO

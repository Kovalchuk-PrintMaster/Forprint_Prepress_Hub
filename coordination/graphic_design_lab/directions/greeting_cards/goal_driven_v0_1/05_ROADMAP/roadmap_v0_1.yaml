    state: PLANNED_UNVERIFIED
    depends_on: []
  - id: R2.2
    objective: Машинна модель rework loop із порівнянням дефектів
    acceptance_check: demonstrated short/long retry sequence
    required_evidence: rework scenario trace
    state: PLANNED_UNVERIFIED
    depends_on: []
  - id: R2.3
    objective: Handoff ZIP contract і source fidelity
    acceptance_check: zip integrity, exact text and source-linked assets

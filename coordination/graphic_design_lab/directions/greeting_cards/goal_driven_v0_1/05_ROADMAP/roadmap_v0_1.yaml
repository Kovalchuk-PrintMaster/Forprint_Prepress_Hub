    acceptance_check: compare code + GC15B geometry & r006 evidence
    required_evidence: canonical skeleton crosswalk
    state: PLANNED_UNVERIFIED
    depends_on:
    - R0.3
  - id: R1.3
    objective: Звірити P01 branding variants, P03 flowers/photo, P04 signatures

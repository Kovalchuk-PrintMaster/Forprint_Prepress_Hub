    required_evidence: git inventory + conflict list
    state: PLANNED_UNVERIFIED
    depends_on: []
  - id: R0.2
    objective: Звірити поточні YAML, коди Builder та фактичні Make/CLI entrypoints
    acceptance_check: repo paths and tests inspected
    required_evidence: path-based reconciliation matrix
    state: PLANNED_UNVERIFIED
    depends_on: []
  - id: R0.3
    objective: Зареєструвати пакет як candidate без втручання в runtime
    acceptance_check: no namespace collision; operator approves location
    required_evidence: dry-run & review receipt
    state: PLANNED_UNVERIFIED
    depends_on: []
- id: R1

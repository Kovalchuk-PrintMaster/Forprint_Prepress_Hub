    required_evidence: resource/variant matrix
    state: PLANNED_UNVERIFIED
    depends_on:
    - R0.3
  - id: R1.4
    objective: Узгодити LayoutSpec як одне джерело PDF/AI
    acceptance_check: identical geometry fields, backend parity plan
    required_evidence: LayoutSpec draft + tests
    state: PLANNED_UNVERIFIED
    depends_on:
    - R0.3
  - id: R1.5
    objective: Створити реєстр requirements та Active Assistant Context Pack

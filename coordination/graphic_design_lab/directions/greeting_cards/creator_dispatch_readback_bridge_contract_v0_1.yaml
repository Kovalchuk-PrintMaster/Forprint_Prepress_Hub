  - exact_prompt_hash_must_be_recorded
  - provider_execution_must_remain_false
  - runtime_initialization_must_remain_false
  - production_write_must_remain_false
  - returned_artifact_must_trace_to_task_and_source_asset
  - heavy_creator_artifact_must_remain_external_to_git
  - sanitized_rehearsal_must_not_complete_GC_E2E_04
  - live_completion_requires_actual_creator_result_attachment
  - live_completion_requires_creator_execution_observed
  - complete_greeting_card_composition_is_outside_bridge_authority

prompt:
  project_owned_loader: prompts/GDL-CREATOR-PORTRAIT-v001.md
  sha256: b03e74b82af2f361b8ed20f78aa70cf623c21d1d68f8356fc3d56170a767ddf8
  role: CREATOR
  format: HYBRID

gc_e2e_04a:

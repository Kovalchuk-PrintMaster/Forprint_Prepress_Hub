scope: GRAPHIC_DESIGN_LAB_ONLY

purpose: >
  Bridge one bounded greeting-card portrait task through the current human
  copy/paste execution boundary, preserve exact prompt and task evidence, and
  validate an externally attached Creator Result Package without claiming
  automated provider execution.


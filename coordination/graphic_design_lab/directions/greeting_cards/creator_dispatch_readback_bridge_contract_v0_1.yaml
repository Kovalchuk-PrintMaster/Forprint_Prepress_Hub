    disposition: REUSE
  prompt_run_record:
    path: coordination/graphic_design_lab/prompt_evidence/schemas/prompt_run_record_v0_1.yaml
    disposition: REUSE_AND_REFINE_FOR_DISPATCH
  workflow_runner:
    path: coordination/graphic_design_lab/workflow/runner_contract_v0_1.yaml
    disposition: REUSE_HUMAN_COPY_PASTE_BRIDGE
  state_machine:

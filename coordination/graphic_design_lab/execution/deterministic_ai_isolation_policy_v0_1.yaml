schema_version: gdl_deterministic_ai_isolation_policy_v0_1
status: ACTIVE_EMPIRICAL_POLICY
policy_statement: AI_MINIMUM_DETERMINISTIC_COMPOSITION_MAXIMUM
rules:
- never_send_whole_approved_design_to_ai_when_bounded_asset_or_parameter_can_change
- freeze_approved_visual_structure_into_canonical_machine_template
- assign_stable_object_ids
- express_geometry_numerically
- express_z_order_deterministically
- fit_typography_algorithmically
- perform_scale_position_crop_mask_bleed_and_export_locally
- use_ai_for_visual_creation_restoration_or_semantic_ambiguity
- normalize_creator_output_before_composition
- customer_corrections_target_object_ids_parameters_or_assets
- structural_redesign_requires_explicit_authorization

schema_version: gdl_cross_run_lessons_draft_v0_1
status: DRAFT_NON_CANONICAL
case_id: GDL-CASE-MENU-001
run_id: RUN-001
lessons:
- id: language_consistency_is_an_intake_gate
  state: STRONG_HYPOTHESIS
  lesson: 'Customer-facing printed products such as menus and informational stands should not accidentally mix languages.
    Mixed-language source material must be detected before Creator handoff.

    '
- id: creator_role_must_be_executable_not_descriptive
  state: STRONG_HYPOTHESIS
  lesson: 'Creator Assistant loader/handoff must explicitly state that the receiving assistant is the execution
    role and must now create the visual result, not produce another brief.

    '
- id: first_concept_needs_artifact_contract
  state: STRONG_HYPOTHESIS
  lesson: 'FIRST_REVIEWABLE_CONCEPT must specify both preview artifacts and editable source artifacts.

    '
- id: first_concept_should_test_variant_policy
  state: HYPOTHESIS
  lesson: 'For visually open tasks, defaulting to two meaningfully distinct first-review directions may produce
    better client feedback than a single concept.

    '
- id: mandatory_identity_elements_need_compliance_check
  state: STRONG_HYPOTHESIS
  lesson: 'Mandatory content such as venue name must have an explicit pre-return checklist.

    '
- id: creator_output_must_declare_review_readiness
  state: STRONG_HYPOTHESIS
  lesson: A Creator output must explicitly declare whether it is customer-review-ready. Visual plausibility is not
    evidence of factual compliance.
- id: style_only_outputs_require_visible_noncustomer_label
  state: STRONG_HYPOTHESIS
  lesson: Any style exploration using placeholder, partial, or non-customer content must be classified as STYLE_ONLY_REFERENCE,
    block customer forwarding, and carry a visible non-customer label.
- id: customer_review_readiness_requires_content_fidelity_check
  state: STRONG_HYPOTHESIS
  lesson: Before customer forwarding, every visible factual item must be checked against authorized source content;
    wrong or invented content is a hard failure even when the customer likes the visual direction.
- id: customer_review_ready_requires_artifact_cleanliness_gate
  state: STRONG_HYPOTHESIS
  lesson: Visible template remnants, rotated fragments or accidental layout debris are hard blockers for customer-review-ready
    classification.
- id: page_count_must_not_imply_false_completeness
  state: STRONG_HYPOTHESIS
  lesson: Pagination such as 1/2 and 2/2 must not imply that a menu is complete when known confirmed customer content
    is still omitted.
- id: correction_runs_need_content_and_visual_direction_locks
  state: STRONG_HYPOTHESIS
  lesson: When a customer likes the visual direction but content needs correction, the workflow must preserve the
    approved visual direction independently from the content-replacement operation.
- id: generic_food_imagery_needs_nonfactual_role
  state: OPEN_HYPOTHESIS
  lesson: Generic/generated food imagery may be useful as decorative atmosphere, but should not be presented as
    a factual depiction of a specific customer dish unless dish identity is verified.
do_not_promote_yet:
- exact_number_of_variants_for_all_products
- SVG_as_universal_final_production_format
- one_fixed_layer_model_for_all_design_tasks
